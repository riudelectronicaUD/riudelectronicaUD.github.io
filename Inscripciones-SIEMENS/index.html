<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Actividad Siemens</title>

  <link rel="stylesheet" href="./style.css?v=4">
</head>

<body>

  <div class="container">

    <h1>Registro de Actividad</h1>

    <p class="descripcion">
      Diligencia tus datos y selecciona la franja horaria.
    </p>

    <form id="registro-form">

      <label for="tipoDocumento">
        Tipo de documento
      </label>

      <select
        id="tipoDocumento"
        name="tipoDocumento"
        required
      >
        <option value="" disabled selected>
          Selecciona el tipo de documento
        </option>

        <option value="CC">
          Cédula de ciudadanía - CC
        </option>

        <option value="TI">
          Tarjeta de identidad - TI
        </option>
      </select>


      <label for="documento">
        Número de documento
      </label>

      <input
        type="text"
        id="documento"
        name="documento"
        inputmode="numeric"
        pattern="[0-9]+"
        placeholder="Ej. 1012345678"
        required
      >


      <label for="codigo">
        Código de estudiante
      </label>

      <input
        type="text"
        id="codigo"
        name="codigo"
        inputmode="numeric"
        placeholder="Ej. 20211005082"
        required
      >


      <label for="nombre">
        Nombre completo
      </label>

      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Escribe tu nombre completo"
        required
      >


      <label for="email">
        Correo institucional
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="usuario@udistrital.edu.co"
        required
      >


      <label for="franja">
        Franja horaria
      </label>

      <select
        id="franja"
        name="franja"
        required
      >
        <option value="" disabled selected>
          Selecciona una franja
        </option>
      </select>


      <button type="submit">
        Registrarse
      </button>

    </form>

  </div>

  <script src="./app.js?v=4"></script>

</body>

</html>
