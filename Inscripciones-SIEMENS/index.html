<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Actividades SIEMENS</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css?v=9"
  >

</head>


<body>

  <div class="container">


    <!-- ==================================================
         TÍTULO
    =================================================== -->

    <h1>
      Actividades SIEMENS
    </h1>


    <!-- ==================================================
         DESCRIPCIÓN
    =================================================== -->

    <p class="descripcion">
      Diligencia tus datos y selecciona la franja horaria
      en la que deseas participar.
    </p>


    <!-- ==================================================
         FORMULARIO
    =================================================== -->

    <form id="registro-form">


      <!-- ==================================================
           TIPO DE DOCUMENTO
      =================================================== -->

      <label for="tipoDocumento">
        Tipo de documento
      </label>


      <select
        id="tipoDocumento"
        name="tipoDocumento"
        required
      >

        <option
          value=""
          disabled
          selected
        >
          Selecciona el tipo de documento
        </option>


        <option value="CC">
          Cédula de ciudadanía - CC
        </option>


        <option value="TI">
          Tarjeta de identidad - TI
        </option>

      </select>



      <!-- ==================================================
           NÚMERO DE DOCUMENTO
      =================================================== -->

      <label for="documento">
        Número de documento
      </label>


      <input
        type="text"
        id="documento"
        name="documento"
        inputmode="numeric"
        pattern="[0-9]+"
        placeholder="Ej. 1012345678"
        autocomplete="off"
        required
      >



      <!-- ==================================================
           CÓDIGO DE ESTUDIANTE
      =================================================== -->

      <label for="codigo">
        Código de estudiante
      </label>


      <input
        type="text"
        id="codigo"
        name="codigo"
        inputmode="numeric"
        pattern="[0-9]+"
        placeholder="Ej. 20211005082"
        autocomplete="off"
        required
      >



      <!-- ==================================================
           NOMBRE COMPLETO
      =================================================== -->

      <label for="nombre">
        Nombre completo
      </label>


      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Escribe tu nombre completo"
        autocomplete="name"
        required
      >



      <!-- ==================================================
           CORREO INSTITUCIONAL
      =================================================== -->

      <label for="email">
        Correo institucional
      </label>


      <input
        type="email"
        id="email"
        name="email"
        placeholder="usuario@udistrital.edu.co"
        autocomplete="email"
        required
      >



      <!-- ==================================================
           FRANJA HORARIA
      =================================================== -->

      <label for="franja">
        Franja horaria
      </label>


      <select
        id="franja"
        name="franja"
        required
      >

        <option
          value=""
          disabled
          selected
        >
          Selecciona una franja
        </option>

      </select>



      <!-- ==================================================
           BOTÓN
      =================================================== -->

      <button
        type="submit"
      >
        Registrarse
      </button>


    </form>

  </div>


  <!-- ====================================================
       JAVASCRIPT
  ===================================================== -->

  <script
    src="./app.js?v=9"
  ></script>


</body>

</html>
